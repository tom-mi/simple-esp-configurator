[project]
name = "e2e-tests"
requires-python = ">=3.11"
version = "0.1.0"
dependencies = [
    "playwright>=1.63.0",
    "pytest",
    "pytest-playwright>=0.9.0",
    "pytest-rerunfailures>=16.7",
    "dnspython>=2.6.0",
    "pytest-order>=1.5.0",
]

[tool.pytest.ini_options]
markers = [
    "esp32: requires a connected ESP32",
    "esp8266: requires a connected ESP8266",
    "offline: runs without a connected device",
]
addopts = '--order-scope=module'
#reruns = 3
