
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++20 -DCORE_DEBUG_LEVEL=3



[env:example-basic-wifi]
build_src_filter = +<../examples/basic-wifi/*> +<*>

[env:example-minimal-wifi]
build_src_filter = +<../examples/minimal-wifi/*> +<*>

[env:example-minimal-ethernet]
# todo consider changing board & also add e2e test with ethernet capable board
build_src_filter = +<../examples/minimal-ethernet/*> +<*>

[env:example-minimal]
build_src_filter = +<../examples/minimal/*> +<*>
extra_scripts = pre:static_network.py

[env:example-empty-baseline]
build_src_filter = +<../examples/empty-baseline/*> +<*>
extra_scripts = pre:static_network.py

[env:test-e2e-esp32]
build_src_filter = +<../e2e-tests/firmware/default/*> +<*>
extra_scripts = pre:static_network.py

[env:test-e2e-esp32-poe]
board = esp32-poe
build_src_filter = +<../e2e-tests/firmware/default/*> +<*>
extra_scripts = pre:static_network.py

[env:test-e2e-ota-esp32]
build_src_filter = +<../e2e-tests/firmware/ota/*> +<*>
extra_scripts = pre:static_network.py

[env:test-e2e-ota-esp32-poe]
board = esp32-poe
build_src_filter = +<../e2e-tests/firmware/ota/*> +<*>
extra_scripts = pre:static_network.py
