
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++20 -DCORE_DEBUG_LEVEL=3



[env:example-basic]
build_src_filter = +<../examples/basic/*> +<*>

[env:test-e2e-default]
build_src_filter = +<../e2e-tests/firmware/default/*> +<*>
extra_scripts = pre:static_wifi.py
